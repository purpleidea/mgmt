# Debian's signed network grub has its prefix hard-coded, and only ever reads
# this one file, which is shared by every debian version of this architecture.
# Instead, we pick the menu of the host by its mac address, or the default one.
# We can't check if these exist first, since grub's test -e lists the directory
# which doesn't work over tftp. A missing file only prints an error, and every
# menu sets the mgmt_menu variable, so we know when we need to use the default.
source "$prefix/grub.cfg-$net_default_mac"
if [ -z "$mgmt_menu" ]; then
	source "$prefix/grub.cfg-default"
fi
